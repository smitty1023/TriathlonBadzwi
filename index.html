<!DOCTYPE html>

  <title>Tri-Duell 🏁</title>

<body>
<div id="root"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, limit, deleteDoc, doc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Firebase Config ──────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCK3_0SUOrmRVsNCCXGJmXYwSKNvaBJO-8",
  authDomain: "triathlon-455c8.firebaseapp.com",
  projectId: "triathlon-455c8",
  storageBucket: "triathlon-455c8.firebasestorage.app",
  messagingSenderId: "1087991994879",
  appId: "1:1087991994879:web:8c79b6fdebcb6ea2262fca"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Constants ────────────────────────────────────────────────────────────────
const RACE_DATE      = new Date("2026-08-30");
const ATHLETES       = ["Smitty", "J-Smooth"];
const COLORS         = { Smitty: "#00e5ff", "J-Smooth": "#ff6b35" };
const ICONS          = { Smitty: "🔵", "J-Smooth": "🟠" };
const SPORT_ICONS    = { Schwimmen:"🏊",Radfahren:"🚴",Laufen:"🏃",Brick:"🔥",Krafttraining:"🏋️",Basketball:"🏀",Padel:"🎾",Yoga:"🧘",Wandern:"🥾",Anderes:"⚡" };
const SPORT_CAT      = { Schwimmen:"tri",Radfahren:"tri",Laufen:"tri",Brick:"tri",Krafttraining:"extra",Basketball:"extra",Padel:"extra",Yoga:"extra",Wandern:"extra",Anderes:"extra" };
const TRACK_FIELDS   = { Laufen:["distanz","puls_avg","puls_max","pace"],Radfahren:["distanz","puls_avg","puls_max","speed"],Schwimmen:["distanz","schwimmbahnen"],Brick:["distanz","puls_avg"],Wandern:["distanz"] };
const MOTI           = [
  {e:"🔥",t:"Diese Woche war ruhig – aber der 30. August wartet nicht! Nächste Woche gebt ihr Gas, oder?"},
  {e:"😤",t:"Auch eine leichte Woche bringt euch näher ans Ziel. Jetzt wieder anziehen – gemeinsam!"},
  {e:"💪",t:"Jan Frodeno hatte auch Wochen wo er lieber auf dem Sofa saß. Dann hat er trotzdem trainiert."},
  {e:"🏁",t:"Noch ein paar Wochen bis zum Rennen. Jede Einheit zählt – auch die kleine!"},
  {e:"🤜🤛",t:"Einer muss anfangen. Und dann zieht der andere nach. Wer macht heute den ersten Schritt?"},
  {e:"😎",t:"Padel und Basketball zählen auch – aber der Triathlon trainiert sich nicht von selbst!"},
];
// 🎂 Birthday – nach Samstag: BIRTHDAY = null setzen
const BIRTHDAY = { athlete: "J-Smooth", until: new Date("2026-05-25") };

function daysLeft() { return Math.ceil((RACE_DATE - new Date()) / 86400000); }
function showBday()  { return BIRTHDAY && new Date() <= BIRTHDAY.until; }

// ── Training Plan ────────────────────────────────────────────────────────────
const PLAN_START = new Date("2026-05-25");
const PHASES = [
  {name:"Basis",weeks:[1,2,3,4],color:"#4ade80"},
  {name:"Aufbau",weeks:[5,6,7,8],color:"#facc15"},
  {name:"Intensität",weeks:[9,10,11,12],color:"#fb923c"},
  {name:"Peak & Taper",weeks:[13,14,15,16],color:"#f87171"},
];
const SESSIONS = [
  [{day:"Di",sport:"Schwimmen",desc:"Technik-Schwimmen",dur:30,detail:"4×100m Pause 30s, Fokus Gleiten"},{day:"Do",sport:"Laufen",desc:"Lockerer Dauerlauf",dur:35,detail:"Puls 130-140, Grundlage aufbauen"},{day:"Sa",sport:"Radfahren",desc:"Grundlagenfahrt",dur:60,detail:"Zone 2, flache Strecke, Tritt ≥85 rpm"},{day:"So",sport:"Laufen",desc:"Langer Lauf",dur:45,detail:"Sehr locker, Puls <140"}],
  [{day:"Di",sport:"Schwimmen",desc:"Ausdauer-Schwimmen",dur:35,detail:"600m kontinuierlich, danach 4×50m Sprints"},{day:"Do",sport:"Radfahren",desc:"Intervallfahrt",dur:45,detail:"5×3 min Zone 3, Pause 2 min"},{day:"Sa",sport:"Laufen",desc:"Tempodauerlauf",dur:40,detail:"Mittelstrecke, Puls 145-155"},{day:"So",sport:"Schwimmen",desc:"Regeneration",dur:30,detail:"Ruhiges Schwimmen, Technikfokus"}],
  [{day:"Di",sport:"Laufen",desc:"Fahrtspiel",dur:40,detail:"10 min warm up, 5×2 min flott / 2 min traben"},{day:"Do",sport:"Schwimmen",desc:"Streckenausdauer",dur:35,detail:"750m non-stop, Rennpace"},{day:"Sa",sport:"Radfahren",desc:"Lange Fahrt",dur:75,detail:"Zone 2, Verpflegung üben"},{day:"So",sport:"Laufen",desc:"Easy Run",dur:30,detail:"Sehr locker, frisch bleiben"}],
  [{day:"Di",sport:"Schwimmen",desc:"Deload – Technik",dur:25,detail:"Nur Technik, kein Druck"},{day:"Do",sport:"Laufen",desc:"Deload – locker",dur:30,detail:"Puls <130, Regeneration"},{day:"Sa",sport:"Radfahren",desc:"Deload – Fahrt",dur:45,detail:"Zone 1-2, locker rollen"}],
  [{day:"Di",sport:"Schwimmen",desc:"Intervall-Schwimmen",dur:40,detail:"8×100m mit 20s Pause, Rennpace"},{day:"Do",sport:"Radfahren",desc:"Schwelle",dur:50,detail:"3×8 min an der Schwelle, Pause 4 min"},{day:"Sa",sport:"Brick",desc:"Brick-Training",dur:60,detail:"45 min Rad + sofort 15 min Laufen"},{day:"So",sport:"Laufen",desc:"Langer Lauf",dur:50,detail:"Zone 2, konstantes Tempo"}],
  [{day:"Di",sport:"Schwimmen",desc:"Rennsimulation",dur:35,detail:"750m Rennpace, dann 4×50m Speed"},{day:"Do",sport:"Laufen",desc:"Tempointervalle",dur:45,detail:"3×1 km Renntempo, Pause 2 min"},{day:"Sa",sport:"Radfahren",desc:"Hügel",dur:60,detail:"Hügel suchen, Kraft und Technik"},{day:"So",sport:"Schwimmen",desc:"Aerob",dur:35,detail:"1200m locker, Technikfokus"}],
  [{day:"Di",sport:"Brick",desc:"Kurz-Brick",dur:55,detail:"30 min Rad + 20 min Laufen, Wettkampfpace"},{day:"Do",sport:"Schwimmen",desc:"Sprint-Intervalle",dur:35,detail:"10×50m Sprint, Pause 30s"},{day:"Sa",sport:"Radfahren",desc:"Lange Fahrt",dur:90,detail:"Zone 2, Ernährung üben, 27km+ Strecke"},{day:"So",sport:"Laufen",desc:"Mittellanger Lauf",dur:50,detail:"Gleichmäßiges Tempo, Puls 145"}],
  [{day:"Di",sport:"Schwimmen",desc:"Deload",dur:25,detail:"Locker, Technik"},{day:"Do",sport:"Laufen",desc:"Deload",dur:30,detail:"Sehr locker"},{day:"Sa",sport:"Radfahren",desc:"Deload",dur:45,detail:"Zone 1, Regeneration"}],
  [{day:"Di",sport:"Schwimmen",desc:"Race-Pace-Schwimmen",dur:40,detail:"2×750m Rennpace, Pause 3 min"},{day:"Do",sport:"Radfahren",desc:"VO2max Intervalle",dur:55,detail:"6×4 min VO2max, Pause 3 min"},{day:"Sa",sport:"Brick",desc:"Rennsimulation Brick",dur:70,detail:"27 km Rad + 5,4 km Laufen – Rennpace!"},{day:"So",sport:"Laufen",desc:"Easy Recovery",dur:30,detail:"Sehr locker, Puls <130"}],
  [{day:"Di",sport:"Schwimmen",desc:"Strecke + Speed",dur:40,detail:"500m Rennpace, 10×50m Max"},{day:"Do",sport:"Laufen",desc:"5km-Test",dur:35,detail:"5 km so schnell wie möglich – Zeitnahme!"},{day:"Sa",sport:"Radfahren",desc:"Rennstrecke",dur:75,detail:"27 km Rennstrecke, Zeitnahme"},{day:"So",sport:"Schwimmen",desc:"Regeneration",dur:30,detail:"Locker, Dehnen im Wasser"}],
  [{day:"Di",sport:"Brick",desc:"Wettkampf-Brick",dur:75,detail:"Komplette Sprint-Distanz simulieren"},{day:"Do",sport:"Schwimmen",desc:"Technik & Speed",dur:35,detail:"Fokus Wende, Startsprung"},{day:"Sa",sport:"Radfahren",desc:"Intervallfahrt",dur:60,detail:"5×5 min Schwelle, Pause 3 min"},{day:"So",sport:"Laufen",desc:"Tempodauerlauf",dur:40,detail:"Puls 150-160, Rennpace Feeling"}],
  [{day:"Di",sport:"Schwimmen",desc:"Deload",dur:25,detail:"Locker"},{day:"Do",sport:"Laufen",desc:"Deload",dur:25,detail:"Locker"},{day:"Sa",sport:"Radfahren",desc:"Deload",dur:40,detail:"Locker rollen"}],
  [{day:"Di",sport:"Schwimmen",desc:"Kurze Schwelle",dur:30,detail:"4×100m Rennpace, dann locker"},{day:"Do",sport:"Radfahren",desc:"Kurze Intervalle",dur:40,detail:"3×5 min Zone 4, Beine frisch halten"},{day:"Sa",sport:"Brick",desc:"Kurz-Brick",dur:50,detail:"20 min Rad Rennpace + 15 min Laufen"},{day:"So",sport:"Laufen",desc:"Locker",dur:25,detail:"Sehr entspannt"}],
  [{day:"Di",sport:"Schwimmen",desc:"Renngefühl",dur:25,detail:"750m Rennpace – ein letztes Mal"},{day:"Do",sport:"Laufen",desc:"Lockerheit",dur:25,detail:"Kurze Steigerungen, Beine wach"},{day:"Sa",sport:"Radfahren",desc:"Activation",dur:35,detail:"Locker mit 3×2 min flottes Treten"}],
  [{day:"Di",sport:"Schwimmen",desc:"Super kurz",dur:20,detail:"400m locker, Technik genießen"},{day:"Do",sport:"Laufen",desc:"Joggen",dur:15,detail:"15 min locker, Beine ausschütteln"}],
  [{day:"Mo",sport:"Schwimmen",desc:"Mini-Aktivierung",dur:15,detail:"300m locker, lächeln"},{day:"Di",sport:"Laufen",desc:"Mini-Aktivierung",dur:10,detail:"10 min lockeres Traben"},{day:"So",sport:"Radfahren",desc:"🏁 RENNTAG!",dur:0,detail:"Sprint-Triathlon – alles geben!"}],
];
function getPlan() {
  return Array.from({length:16},(_,w)=>{
    const d=new Date(PLAN_START); d.setDate(d.getDate()+w*7);
    const phase=PHASES.find(p=>p.weeks.includes(w+1));
    return {weekNum:w+1,phase:phase.name,color:phase.color,start:d,sessions:SESSIONS[w],deload:[4,8,12].includes(w+1)};
  });
}
function getCurWeek() { return Math.max(0,Math.min(Math.floor((new Date()-PLAN_START)/604800000),15)); }
const PLAN = getPlan();

// ── State ────────────────────────────────────────────────────────────────────
let state = {
  tab: "feed",
  user: "Smitty",
  entries: [],
  messages: [],
  showLog: false,
  selWeek: getCurWeek(),
  form: emptyForm("Laufen"),
  saving: false,
  sending: false,
  toast: null,
  moti: null,
  motiLoading: false,
  chatInput: "",
};

function emptyForm(sport) {
  return {sport,duration:"",note:"",emoji:"💪",distanz:"",puls_avg:"",puls_max:"",pace:"",speed:"",schwimmbahnen:""};
}

function setState(patch) {
  state = {...state,...patch};
  render();
}

// ── Firebase Listeners ───────────────────────────────────────────────────────
const entryQ = query(collection(db,"entries"), orderBy("ts","desc"));
onSnapshot(entryQ, snap => {
  state.entries = snap.docs.map(d=>({id:d.id,...d.data()}));
  checkMoti(state.entries);
  render();
});
const msgQ = query(collection(db,"messages"), orderBy("ts","asc"), limit(200));
onSnapshot(msgQ, snap => {
  state.messages = snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
  setTimeout(()=>{ const b=document.getElementById("chatBottom"); if(b) b.scrollIntoView({behavior:"smooth"}); },50);
});

function checkMoti(entries) {
  const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const triSports=["Schwimmen","Radfahren","Laufen","Brick"];
  const wkTri=entries.filter(e=>e.ts?.toDate?.()>=mon&&triSports.includes(e.sport));
  if(new Date().getDay()>=3&&wkTri.length<2&&!state.moti) {
    state.moti=MOTI[Math.floor(Math.random()*MOTI.length)];
  }
}

async function saveEntry() {
  if(!state.form.duration) return;
  setState({saving:true});
  try {
    const f=state.form;
    await addDoc(collection(db,"entries"),{
      athlete:state.user, sport:f.sport, duration:parseInt(f.duration),
      note:f.note, emoji:f.emoji, ts:serverTimestamp(),
      tracking:{
        distanz:f.distanz?parseFloat(f.distanz):null,
        puls_avg:f.puls_avg?parseInt(f.puls_avg):null,
        puls_max:f.puls_max?parseInt(f.puls_max):null,
        pace:f.pace||null, speed:f.speed?parseFloat(f.speed):null,
        schwimmbahnen:f.schwimmbahnen?parseInt(f.schwimmbahnen):null,
      },
    });
    showToast(ICONS[state.user]+" Einheit gespeichert!");
    setState({form:emptyForm("Laufen"),showLog:false,tab:"feed",saving:false});
  } catch(e) { showToast("❌ Fehler"); setState({saving:false}); }
}

async function sendMsg() {
  const text=state.chatInput.trim(); if(!text) return;
  setState({sending:true});
  try {
    await addDoc(collection(db,"messages"),{author:state.user,text,ts:serverTimestamp()});
    setState({chatInput:"",sending:false});
  } catch(e) { setState({sending:false}); }
}

async function deleteEntry(id) {
  if (!confirm("Einheit löschen?")) return;
  try {
    await deleteDoc(doc(db, "entries", id));
  } catch(e) { alert("Fehler beim Löschen"); }
}
  setState({motiLoading:true});
  try {
    const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); mon.setHours(0,0,0,0);
    const tri=["Schwimmen","Radfahren","Laufen","Brick"];
    const wk=state.entries.filter(e=>e.ts?.toDate?.()>=mon);
    const tc=wk.filter(e=>tri.includes(e.sport)).length;
    const ec=wk.filter(e=>!tri.includes(e.sport)).length;
    const prompt=`Du bist Triathlon-Coach für Smitty und J-Smooth, die am 31.8.2026 ihren ersten Sprint-Triathlon machen. Noch ${daysLeft()} Tage. Diese Woche: ${tc} Tri-Einheiten, ${ec} andere. Kurze, motivierende, humorvolle Nachricht auf Deutsch (2-3 Sätze). Direkt anfangen.`;
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();
    const text=data.content?.map(c=>c.text||"").join("")||"";
    if(text) setState({moti:{e:"🤖",t:text.trim(),ai:true},motiLoading:false});
  } catch(e) { setState({moti:MOTI[0],motiLoading:false}); }
}

function showToast(msg) {
  setState({toast:msg});
  setTimeout(()=>setState({toast:null}),2500);
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const root=document.getElementById("root");
  const s=state;
  const days=daysLeft();
  const week=PLAN[s.selWeek];
  const curW=getCurWeek();
  const other=s.user==="Smitty"?"J-Smooth":"Smitty";
  const tf=TRACK_FIELDS[s.form.sport]||[];

  const fmtDate=d=>d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
  const fmtTs=ts=>{ if(!ts?.toDate) return ""; const d=ts.toDate(); return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); };

  root.innerHTML = `
  <div style="min-height:100vh;background:#0a0e1a;color:#e8eaf0;max-width:480px;margin:0 auto;padding-bottom:80px;">

    <!-- HEADER -->
    <div style="background:linear-gradient(135deg,#0d1528,#111c35);border-bottom:1px solid #1e2d4a;padding:18px 18px 14px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-size:10px;letter-spacing:3px;color:#4a7ab5;text-transform:uppercase;margin-bottom:3px;">Sprint Triathlon</div>
          <div style="font-size:22px;font-weight:800;">🏁 ${days} Tage</div>
          <div style="font-size:12px;color:#6b8ab0;margin-top:1px;">bis 30. August 2026</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:10px;color:#4a7ab5;letter-spacing:2px;margin-bottom:5px;">DU BIST</div>
          <div style="display:flex;gap:5px;">
            ${ATHLETES.map(a=>`
              <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
                <button onclick="setUser('${a}')" style="padding:5px 11px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:${s.user===a?COLORS[a]:"#1a2540"};color:${s.user===a?"#0a0e1a":"#6b8ab0"};">${ICONS[a]} ${a}</button>
                ${showBday()&&a===BIRTHDAY.athlete?`<div style="font-size:10px;color:#f9a8d4;font-weight:700;">🎂 Happy Birthday!</div>`:""}
              </div>
            `).join("")}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:7px;margin-top:12px;">
        ${[["🏊","750m"],["🚴","27km"],["🏃","5,4km"]].map(([ic,d])=>`
          <div style="flex:1;background:#0d1528;border-radius:10px;padding:6px 0;border:1px solid #1e2d4a;text-align:center;">
            <div style="font-size:15px;">${ic}</div>
            <div style="font-size:11px;font-weight:700;color:#00e5ff;">${d}</div>
          </div>
        `).join("")}
      </div>
    </div>

    ${s.toast?`<div style="position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1e2d4a;color:#e8eaf0;padding:9px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;border:1px solid #00e5ff40;white-space:nowrap;">${s.toast}</div>`:""}

    <div style="padding:15px;">

    <!-- FEED -->
    ${s.tab==="feed"?`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:17px;font-weight:800;">Activity Feed</div>
        <button onclick="toggleLog()" style="background:${COLORS[s.user]};color:#0a0e1a;border:none;border-radius:20px;padding:7px 15px;font-weight:800;font-size:12px;cursor:pointer;">
          ${s.showLog?"✕ Schließen":"+ Einheit"}
        </button>
      </div>

      ${s.showLog?`
      <div style="background:#111c35;border-radius:16px;padding:15px;border:1px solid #1e2d4a;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="font-size:13px;font-weight:700;color:${COLORS[s.user]};">${ICONS[s.user]} ${s.user}s Einheit</div>
          <button onclick="setState({showLog:false})" style="background:#1a2540;border:none;color:#6b8ab0;border-radius:20px;width:28px;height:28px;font-size:15px;cursor:pointer;">✕</button>
        </div>
        <div style="font-size:10px;color:#4a7ab5;font-weight:700;letter-spacing:1px;margin-bottom:6px;">TRIATHLON</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;">
          ${["Schwimmen","Radfahren","Laufen","Brick"].map(sp=>`
            <button onclick="setFormSport('${sp}')" style="padding:5px 11px;border-radius:16px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:${s.form.sport===sp?COLORS[s.user]:"#1a2540"};color:${s.form.sport===sp?"#0a0e1a":"#6b8ab0"};">${SPORT_ICONS[sp]} ${sp}</button>
          `).join("")}
        </div>
        <div style="font-size:10px;color:#4a7ab5;font-weight:700;letter-spacing:1px;margin-bottom:6px;">EXTRAS</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;">
          ${["Krafttraining","Basketball","Padel","Yoga","Wandern","Anderes"].map(sp=>`
            <button onclick="setFormSport('${sp}')" style="padding:5px 11px;border-radius:16px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:${s.form.sport===sp?"#a855f7":"#1a2540"};color:${s.form.sport===sp?"#fff":"#6b8ab0"};">${SPORT_ICONS[sp]} ${sp}</button>
          `).join("")}
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <input type="text" inputmode="numeric" placeholder="Dauer (min)" value="${s.form.duration}" oninput="setFormField('duration',this.value)"
            style="flex:1;background:#0d1528;border:1px solid #1e2d4a;border-radius:10px;padding:9px 12px;color:#e8eaf0;font-size:13px;outline:none;" />
          <select onchange="setFormField('emoji',this.value)" style="background:#0d1528;border:1px solid #1e2d4a;border-radius:10px;padding:9px 8px;color:#e8eaf0;font-size:17px;outline:none;">
            ${["💪","🔥","😅","😎","🤩","😤","🥵","💯","🏆","😴"].map(e=>`<option value="${e}" ${s.form.emoji===e?"selected":""}>${e}</option>`).join("")}
          </select>
        </div>
        ${tf.length?`
        <div style="background:#0d1528;border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1px solid #1e2d4a;">

          <div style="flex:1;background:#111c35;border-radius:14px;padding:13px;border:1px solid #00e5ff20;text-align:center;">
            <div style="font-size:20px;">🏊🚴🏃</div>
            <div style="font-size:13px;font-weight:800;margin-top:3px;">${triLeader.athlete}</div>
            <div style="font-size:10px;color:#6b8ab0;margin-top:2px;">Tri-Lead</div>
          </div>
        </div>`;
      })()}
      `:""}
      <button onclick="fetchAiMoti()" ${s.motiLoading?"disabled":""} style="width:100%;background:#1a1040;color:#a855f7;border:1px solid #a855f730;border-radius:12px;padding:10px;font-weight:700;font-size:12px;cursor:pointer;opacity:${s.motiLoading?0.6:1};">
        ${s.motiLoading?"⏳ Coach denkt...":"🤖 KI-Coach Motivation holen"}
      </button>
    `:""}

    <!-- CHAT -->
    ${s.tab==="chat"?`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div>
          <div style="font-size:17px;font-weight:800;">💬 Chat</div>
          <div style="font-size:11px;color:#4a7ab5;margin-top:1px;">${ICONS[s.user]} Du · ${ICONS[other]} ${other}</div>
        </div>
      </div>
      <div id="chatBox" style="background:#0d1528;border-radius:16px;padding:11px;height:360px;overflow-y:auto;border:1px solid #1e2d4a;margin-bottom:11px;display:flex;flex-direction:column;gap:7px;">
        ${s.messages.length===0?`
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a7ab5;text-align:center;">
            <div style="font-size:30px;margin-bottom:7px;">💬</div>
            <div style="font-weight:700;">Noch keine Nachrichten</div>
            <div style="font-size:12px;margin-top:3px;">Wer trainiert heute?</div>
          </div>
        `:s.messages.map(msg=>{
          const isMe=msg.author===s.user;
          const timeStr=msg.ts?.toDate?msg.ts.toDate().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"";
          return `
          <div style="display:flex;flex-direction:column;align-items:${isMe?"flex-end":"flex-start"};">
            <div style="max-width:80%;padding:8px 12px;border-radius:${isMe?"15px 15px 3px 15px":"15px 15px 15px 3px"};background:${isMe?COLORS[s.user]+"22":"#1a2540"};border:1px solid ${isMe?COLORS[s.user]+"45":"#2a3a5a"};">
              <div style="font-size:13px;color:#e8eaf0;line-height:1.45;">${msg.text}</div>
            </div>
            <div style="font-size:10px;color:#3a5070;margin-top:2px;">
              <span style="color:${COLORS[msg.author]};font-weight:700;">${ICONS[msg.author]} ${msg.author}</span> · ${timeStr}
            </div>
          </div>`;
        }).join("")}
        <div id="chatBottom"></div>
      </div>
      <div style="display:flex;gap:7px;margin-bottom:9px;">
        <input id="chatInput" value="${s.chatInput.replace(/"/g,'&quot;')}" oninput="setState({chatInput:this.value})" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}" placeholder="Schreib ${other} was..."
          style="flex:1;background:#111c35;border:1px solid #1e2d4a;border-radius:12px;padding:10px 13px;color:#e8eaf0;font-size:13px;outline:none;" />
        <button onclick="sendMsg()" ${s.sending||!s.chatInput.trim()?"disabled":""} style="background:${COLORS[s.user]};color:#0a0e1a;border:none;border-radius:12px;padding:10px 17px;font-weight:800;font-size:15px;cursor:pointer;opacity:${s.sending||!s.chatInput.trim()?0.45:1};">➤</button>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;">
        ${["💪 War heute im Training!","😅 Heute wird nix mehr...","🔥 Wann trainierst du?","🏊 Pool morgen?","🚴 Fahrt am Wochenende?","😎 Keine Ausreden!","🏃 5km heute?","🎾 Padel später?"].map(q=>`
          <button onclick="setState({chatInput:'${q}'})" style="background:#111c35;border:1px solid #1e2d4a;color:#6b8ab0;border-radius:18px;padding:4px 10px;font-size:10px;cursor:pointer;font-weight:600;">${q}</button>
        `).join("")}
      </div>
    `:""}

    </div>

    <!-- BOTTOM NAV -->
    <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0d1528;border-top:1px solid #1e2d4a;display:flex;">
      ${[{id:"feed",icon:"📡",label:"Feed"},{id:"plan",icon:"📋",label:"Plan"},{id:"stats",icon:"⚡",label:"Duell"},{id:"chat",icon:"💬",label:"Chat"}].map(t=>`
        <button onclick="setState({tab:'${t.id}'})" style="flex:1;padding:11px 0 9px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid ${s.tab===t.id?COLORS[s.user]:"transparent"};">
          <span style="font-size:19px;">${t.icon}</span>
          <span style="font-size:10px;font-weight:700;color:${s.tab===t.id?COLORS[s.user]:"#4a7ab5"};">${t.label}</span>
        </button>
      `).join("")}
    </div>
  </div>`;

  // Re-focus chat input if chat tab active
  if(s.tab==="chat") {
    const inp=document.getElementById("chatInput");
    // don't steal focus on mobile
  }
}

// ── Global handlers ───────────────────────────────────────────────────────────
window.setState    = (patch) => { state={...state,...patch}; render(); };
window.setUser     = (u)     => setState({user:u});
window.toggleLog   = ()      => setState({showLog:!state.showLog});
window.setFormSport= (sp)    => setState({form:{...state.form,sport:sp}});
window.setFormField= (k,v)   => setState({form:{...state.form,[k]:v}});
window.saveEntry   = saveEntry;
window.sendMsg     = sendMsg;
window.deleteEntry  = deleteEntry;

render();
</script>
</body>
</html>
