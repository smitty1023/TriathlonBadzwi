<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="icon" href="icon-512.png" />
  <title>Tri-Duell 🏁</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { background: #0a0e1a; font-family: -apple-system, 'Segoe UI', sans-serif; color: #e8eaf0; }

<body>
<div id="root"><div style="color:#4a7ab5;text-align:center;padding:40px;font-size:14px;">Laden...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCK3_0SUOrmRVsNCCXGJmXYwSKNvaBJO-8",
  authDomain: "triathlon-455c8.firebaseapp.com",
  projectId: "triathlon-455c8",
  storageBucket: "triathlon-455c8.firebasestorage.app",
  messagingSenderId: "1087991994879",
  appId: "1:1087991994879:web:8c79b6fdebcb6ea2262fca"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Constants ────────────────────────────────────────────────────────────────
const RACE_DATE  = new Date("2026-08-30");
const ATHLETES   = ["Smitty","J-Smooth"];
const COLORS     = { Smitty:"#00e5ff", "J-Smooth":"#ff6b35" };
const ICONS      = { Smitty:"🔵", "J-Smooth":"🟠" };
const SPORT_ICONS= { Schwimmen:"🏊",Radfahren:"🚴",Laufen:"🏃",Brick:"🔥",Krafttraining:"🏋️",Basketball:"🏀",Padel:"🎾",Yoga:"🧘",Wandern:"🥾",Anderes:"⚡" };
const SPORT_CAT  = { Schwimmen:"tri",Radfahren:"tri",Laufen:"tri",Brick:"tri",Krafttraining:"extra",Basketball:"extra",Padel:"extra",Yoga:"extra",Wandern:"extra",Anderes:"extra" };
const TRACK_FIELDS={ Laufen:["distanz","puls_avg","puls_max","pace"],Radfahren:["distanz","puls_avg","puls_max","speed"],Schwimmen:["distanz","schwimmbahnen"],Brick:["distanz","puls_avg"],Wandern:["distanz"] };
const MOTI=[
  {e:"🔥",t:"Diese Woche war ruhig – aber der 30. August wartet nicht!"},
  {e:"😤",t:"Auch eine leichte Woche bringt euch näher ans Ziel. Jetzt wieder anziehen!"},
  {e:"💪",t:"Jan Frodeno hatte auch schwache Wochen. Dann hat er trotzdem trainiert."},
  {e:"🏁",t:"Jede Einheit zählt – auch die kleine. Macht euch warm!"},
  {e:"🤜🤛",t:"Einer muss anfangen – und dann zieht der andere nach!"},
  {e:"😎",t:"Padel zählt auch – aber der Triathlon trainiert sich nicht von selbst!"},
];


function daysLeft(){ return Math.ceil((RACE_DATE-new Date())/86400000); }

function fmtTs(ts){
  if(!ts||!ts.toDate) return "";
  const d=ts.toDate();
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
}
function fmtDate(d){ return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}); }

// ── Plan ─────────────────────────────────────────────────────────────────────
const PLAN_START=new Date("2026-05-25");
const PHASES=[{name:"Basis",weeks:[1,2,3,4],color:"#4ade80"},{name:"Aufbau",weeks:[5,6,7,8],color:"#facc15"},{name:"Intensität",weeks:[9,10,11,12],color:"#fb923c"},{name:"Peak & Taper",weeks:[13,14,15,16],color:"#f87171"}];
const SESSIONS=[
  [{day:"Di",sport:"Schwimmen",desc:"Technik-Schwimmen",dur:30,detail:"4×100m Pause 30s, Fokus Gleiten"},{day:"Do",sport:"Laufen",desc:"Lockerer Dauerlauf",dur:35,detail:"Puls 130-140"},{day:"Sa",sport:"Radfahren",desc:"Grundlagenfahrt",dur:60,detail:"Zone 2, Tritt ≥85 rpm"},{day:"So",sport:"Laufen",desc:"Langer Lauf",dur:45,detail:"Sehr locker, Puls <140"}],
  [{day:"Di",sport:"Schwimmen",desc:"Ausdauer-Schwimmen",dur:35,detail:"600m kontinuierlich, 4×50m Sprints"},{day:"Do",sport:"Radfahren",desc:"Intervallfahrt",dur:45,detail:"5×3 min Zone 3"},{day:"Sa",sport:"Laufen",desc:"Tempodauerlauf",dur:40,detail:"Puls 145-155"},{day:"So",sport:"Schwimmen",desc:"Regeneration",dur:30,detail:"Ruhiges Schwimmen"}],
  [{day:"Di",sport:"Laufen",desc:"Fahrtspiel",dur:40,detail:"5×2 min flott / 2 min traben"},{day:"Do",sport:"Schwimmen",desc:"Streckenausdauer",dur:35,detail:"750m non-stop, Rennpace"},{day:"Sa",sport:"Radfahren",desc:"Lange Fahrt",dur:75,detail:"Zone 2, Verpflegung üben"},{day:"So",sport:"Laufen",desc:"Easy Run",dur:30,detail:"Sehr locker"}],
  [{day:"Di",sport:"Schwimmen",desc:"Deload – Technik",dur:25,detail:"Nur Technik, kein Druck"},{day:"Do",sport:"Laufen",desc:"Deload – locker",dur:30,detail:"Puls <130"},{day:"Sa",sport:"Radfahren",desc:"Deload – Fahrt",dur:45,detail:"Zone 1-2, locker rollen"}],
  [{day:"Di",sport:"Schwimmen",desc:"Intervall-Schwimmen",dur:40,detail:"8×100m Rennpace"},{day:"Do",sport:"Radfahren",desc:"Schwelle",dur:50,detail:"3×8 min Schwelle"},{day:"Sa",sport:"Brick",desc:"Brick-Training",dur:60,detail:"45 min Rad + 15 min Laufen"},{day:"So",sport:"Laufen",desc:"Langer Lauf",dur:50,detail:"Zone 2"}],
  [{day:"Di",sport:"Schwimmen",desc:"Rennsimulation",dur:35,detail:"750m Rennpace, 4×50m Speed"},{day:"Do",sport:"Laufen",desc:"Tempointervalle",dur:45,detail:"3×1 km Renntempo"},{day:"Sa",sport:"Radfahren",desc:"Hügel",dur:60,detail:"Kraft und Technik"},{day:"So",sport:"Schwimmen",desc:"Aerob",dur:35,detail:"1200m locker"}],
  [{day:"Di",sport:"Brick",desc:"Kurz-Brick",dur:55,detail:"30 min Rad + 20 min Laufen"},{day:"Do",sport:"Schwimmen",desc:"Sprint-Intervalle",dur:35,detail:"10×50m Sprint"},{day:"Sa",sport:"Radfahren",desc:"Lange Fahrt",dur:90,detail:"27km+ Strecke"},{day:"So",sport:"Laufen",desc:"Mittellanger Lauf",dur:50,detail:"Puls 145"}],
  [{day:"Di",sport:"Schwimmen",desc:"Deload",dur:25,detail:"Locker"},{day:"Do",sport:"Laufen",desc:"Deload",dur:30,detail:"Sehr locker"},{day:"Sa",sport:"Radfahren",desc:"Deload",dur:45,detail:"Zone 1"}],
  [{day:"Di",sport:"Schwimmen",desc:"Race-Pace",dur:40,detail:"2×750m Rennpace"},{day:"Do",sport:"Radfahren",desc:"VO2max",dur:55,detail:"6×4 min VO2max"},{day:"Sa",sport:"Brick",desc:"Rennsimulation",dur:70,detail:"27km Rad + 5,4km Laufen!"},{day:"So",sport:"Laufen",desc:"Easy Recovery",dur:30,detail:"Puls <130"}],
  [{day:"Di",sport:"Schwimmen",desc:"Strecke + Speed",dur:40,detail:"500m Rennpace, 10×50m"},{day:"Do",sport:"Laufen",desc:"5km-Test",dur:35,detail:"5km Zeitnahme!"},{day:"Sa",sport:"Radfahren",desc:"Rennstrecke",dur:75,detail:"27km Zeitnahme"},{day:"So",sport:"Schwimmen",desc:"Regeneration",dur:30,detail:"Locker"}],
  [{day:"Di",sport:"Brick",desc:"Wettkampf-Brick",dur:75,detail:"Komplette Distanz simulieren"},{day:"Do",sport:"Schwimmen",desc:"Technik & Speed",dur:35,detail:"Fokus Wende"},{day:"Sa",sport:"Radfahren",desc:"Intervallfahrt",dur:60,detail:"5×5 min Schwelle"},{day:"So",sport:"Laufen",desc:"Tempodauerlauf",dur:40,detail:"Puls 150-160"}],
  [{day:"Di",sport:"Schwimmen",desc:"Deload",dur:25,detail:"Locker"},{day:"Do",sport:"Laufen",desc:"Deload",dur:25,detail:"Locker"},{day:"Sa",sport:"Radfahren",desc:"Deload",dur:40,detail:"Locker"}],
  [{day:"Di",sport:"Schwimmen",desc:"Kurze Schwelle",dur:30,detail:"4×100m Rennpace"},{day:"Do",sport:"Radfahren",desc:"Kurze Intervalle",dur:40,detail:"3×5 min Zone 4"},{day:"Sa",sport:"Brick",desc:"Kurz-Brick",dur:50,detail:"20 min Rad + 15 min Laufen"},{day:"So",sport:"Laufen",desc:"Locker",dur:25,detail:"Sehr entspannt"}],
  [{day:"Di",sport:"Schwimmen",desc:"Renngefühl",dur:25,detail:"750m Rennpace"},{day:"Do",sport:"Laufen",desc:"Lockerheit",dur:25,detail:"Steigerungen"},{day:"Sa",sport:"Radfahren",desc:"Activation",dur:35,detail:"3×2 min flottes Treten"}],
  [{day:"Di",sport:"Schwimmen",desc:"Super kurz",dur:20,detail:"400m locker"},{day:"Do",sport:"Laufen",desc:"Joggen",dur:15,detail:"15 min locker"}],
  [{day:"Mo",sport:"Schwimmen",desc:"Mini-Aktivierung",dur:15,detail:"300m locker"},{day:"Di",sport:"Laufen",desc:"Mini-Aktivierung",dur:10,detail:"10 min Traben"},{day:"So",sport:"Radfahren",desc:"🏁 RENNTAG!",dur:0,detail:"Sprint-Triathlon – alles geben!"}],
];
function getPlan(){
  return Array.from({length:16},(_,w)=>{
    const d=new Date(PLAN_START); d.setDate(d.getDate()+w*7);
    const phase=PHASES.find(p=>p.weeks.includes(w+1));
    return {weekNum:w+1,phase:phase.name,color:phase.color,start:d,sessions:SESSIONS[w],deload:[4,8,12].includes(w+1)};
  });
}
function getCurWeek(){ return Math.max(0,Math.min(Math.floor((new Date()-PLAN_START)/604800000),15)); }
const PLAN=getPlan();

// ── State ─────────────────────────────────────────────────────────────────────
let S={
  tab:"feed", user:"Smitty", entries:[], messages:[],
  showLog:false, selWeek:getCurWeek(),
  form:{sport:"Laufen",duration:"",note:"",emoji:"💪",distanz:"",puls_avg:"",puls_max:"",pace:"",speed:"",schwimmbahnen:""},
  saving:false, sending:false, toast:null, moti:null, motiLoading:false, chatInput:"",
};

function emptyForm(sport){ return {sport,duration:"",note:"",emoji:"💪",distanz:"",puls_avg:"",puls_max:"",pace:"",speed:"",schwimmbahnen:""}; }
function ss(patch){ S={...S,...patch}; render(); }

// ── Firebase listeners ────────────────────────────────────────────────────────
onSnapshot(query(collection(db,"entries"),orderBy("ts","desc")), snap=>{
  S.entries=snap.docs.map(d=>({id:d.id,...d.data()}));
  checkMoti(S.entries);
  render();
});
onSnapshot(query(collection(db,"messages"),orderBy("ts","asc")), snap=>{
  S.messages=snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
  setTimeout(()=>document.getElementById("chatBottom")?.scrollIntoView({behavior:"smooth"}),50);
});

function checkMoti(all){
  const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const wkTri=all.filter(e=>e.ts?.toDate?.()>=mon&&["Schwimmen","Radfahren","Laufen","Brick"].includes(e.sport));
  if(new Date().getDay()>=3&&wkTri.length<2&&!S.moti) S.moti=MOTI[Math.floor(Math.random()*MOTI.length)];
}

async function saveEntry(){
  if(!S.form.duration) return;
  ss({saving:true});
  try{
    const f=S.form;
    await addDoc(collection(db,"entries"),{
      athlete:S.user,sport:f.sport,duration:f.duration,note:f.note,emoji:f.emoji,ts:serverTimestamp(),
      tracking:{distanz:f.distanz||null,puls_avg:f.puls_avg||null,puls_max:f.puls_max||null,pace:f.pace||null,speed:f.speed||null,schwimmbahnen:f.schwimmbahnen||null},
    });
    showToast(ICONS[S.user]+" Einheit gespeichert!");
    ss({form:emptyForm("Laufen"),showLog:false,tab:"feed",saving:false});
  }catch(e){ showToast("❌ Fehler"); ss({saving:false}); }
}

async function delEntry(id){
  if(!confirm("Einheit löschen?")) return;
  try{ await deleteDoc(doc(db,"entries",id)); }
  catch(e){ alert("Fehler beim Löschen"); }
}

async function sendMsg(){
  const text=S.chatInput.trim(); if(!text) return;
  ss({sending:true});
  try{ await addDoc(collection(db,"messages"),{author:S.user,text,ts:serverTimestamp()}); ss({chatInput:"",sending:false}); }
  catch(e){ ss({sending:false}); }
}

async function fetchAiMoti(){
  ss({motiLoading:true});
  try{
    const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); mon.setHours(0,0,0,0);
    const wk=S.entries.filter(e=>e.ts?.toDate?.()>=mon);
    const tc=wk.filter(e=>["Schwimmen","Radfahren","Laufen","Brick"].includes(e.sport)).length;
    const ec=wk.filter(e=>!["Schwimmen","Radfahren","Laufen","Brick"].includes(e.sport)).length;
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,messages:[{role:"user",content:`Du bist Triathlon-Coach für Smitty und J-Smooth. Sprint-Triathlon am 30.8.2026, noch ${daysLeft()} Tage. Diese Woche: ${tc} Tri-Einheiten, ${ec} andere. Kurze, humorvolle Motivation auf Deutsch (2-3 Sätze). Direkt anfangen.`}]})});
    const data=await res.json();
    const text=data.content?.map(c=>c.text||"").join("")||"";
    if(text) ss({moti:{e:"🤖",t:text.trim(),ai:true},motiLoading:false});
  }catch(e){ ss({moti:MOTI[0],motiLoading:false}); }
}

function showToast(msg){ ss({toast:msg}); setTimeout(()=>ss({toast:null}),2500); }

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  // Don't re-render while user is typing in a form field
  const active = document.activeElement;
  if(active && (active.tagName==="INPUT"||active.tagName==="TEXTAREA") && S.showLog) {
    // Only update non-form parts - skip full render
    // Update tab bar and header only
    return;
  }
  const s=S, w=PLAN[s.selWeek], curW=getCurWeek(), other=s.user==="Smitty"?"J-Smooth":"Smitty";
  const tf=TRACK_FIELDS[s.form.sport]||[];

  document.getElementById("root").innerHTML=`
  <div style="min-height:100vh;background:#0a0e1a;color:#e8eaf0;max-width:480px;margin:0 auto;padding-bottom:80px;">

    <!-- HEADER -->
    <div style="background:linear-gradient(135deg,#0d1528,#111c35);border-bottom:1px solid #1e2d4a;padding:18px 18px 14px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-size:10px;letter-spacing:3px;color:#4a7ab5;text-transform:uppercase;margin-bottom:3px;">Sprint Triathlon</div>
          <div style="font-size:22px;font-weight:800;">🏁 ${daysLeft()} Tage</div>
          <div style="font-size:12px;color:#6b8ab0;margin-top:1px;">bis 30. August 2026</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:10px;color:#4a7ab5;letter-spacing:2px;margin-bottom:5px;">DU BIST</div>
          <div style="display:flex;gap:5px;">
            ${ATHLETES.map(a=>`
              <button onclick="setUser('${a}')" style="padding:5px 11px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:${s.user===a?COLORS[a]:"#1a2540"};color:${s.user===a?"#0a0e1a":"#6b8ab0"};">${ICONS[a]} ${a}</button>`).join("")}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:7px;margin-top:12px;">
        ${[["🏊","750m"],["🚴","27km"],["🏃","5,4km"]].map(([ic,d])=>`
          <div style="flex:1;background:#0d1528;border-radius:10px;padding:6px 0;border:1px solid #1e2d4a;text-align:center;">
            <div style="font-size:15px;">${ic}</div>
            <div style="font-size:11px;font-weight:700;color:#00e5ff;">${d}</div>
          </div>`).join("")}
      </div>
    </div>

    ${s.toast?`<div style="position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1e2d4a;color:#e8eaf0;padding:9px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;border:1px solid #00e5ff40;white-space:nowrap;">${s.toast}</div>`:""}

    <div style="padding:15px;">

    <!-- ══ FEED ══ -->
    ${s.tab==="feed"?`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:17px;font-weight:800;">Activity Feed</div>
        <button onclick="toggleLog()" style="background:${COLORS[s.user]};color:#0a0e1a;border:none;border-radius:20px;padding:7px 15px;font-weight:800;font-size:12px;cursor:pointer;">${s.showLog?"✕ Schließen":"+ Einheit"}</button>
      </div>

      ${s.showLog?`
      <div style="background:#111c35;border-radius:16px;padding:15px;border:1px solid #1e2d4a;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="font-size:13px;font-weight:700;color:${COLORS[s.user]};">${ICONS[s.user]} ${s.user}s Einheit</div>
          <button onclick="ss({showLog:false})" style="background:#1a2540;border:none;color:#6b8ab0;border-radius:20px;width:28px;height:28px;font-size:15px;cursor:pointer;">✕</button>
        </div>
        <div style="font-size:10px;color:#4a7ab5;font-weight:700;letter-spacing:1px;margin-bottom:6px;">TRIATHLON</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;">
          ${["Schwimmen","Radfahren","Laufen","Brick"].map(sp=>`<button onclick="setFormSport('${sp}')" style="padding:5px 11px;border-radius:16px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:${s.form.sport===sp?COLORS[s.user]:"#1a2540"};color:${s.form.sport===sp?"#0a0e1a":"#6b8ab0"};">${SPORT_ICONS[sp]} ${sp}</button>`).join("")}
        </div>
        <div style="font-size:10px;color:#4a7ab5;font-weight:700;letter-spacing:1px;margin-bottom:6px;">EXTRAS</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;">
          ${["Krafttraining","Basketball","Padel","Yoga","Wandern","Anderes"].map(sp=>`<button onclick="setFormSport('${sp}')" style="padding:5px 11px;border-radius:16px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:${s.form.sport===sp?"#a855f7":"#1a2540"};color:${s.form.sport===sp?"#fff":"#6b8ab0"};">${SPORT_ICONS[sp]} ${sp}</button>`).join("")}
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <input type="text" inputmode="numeric" placeholder="Dauer (min)" value="${s.form.duration}" onblur="setFF('duration',this.value)" onchange="setFF('duration',this.value)"
            style="flex:1;background:#0d1528;border:1px solid #1e2d4a;border-radius:10px;padding:9px 12px;color:#e8eaf0;font-size:13px;outline:none;" />
          <select onchange="setFF('emoji',this.value)" style="background:#0d1528;border:1px solid #1e2d4a;border-radius:10px;padding:9px 8px;color:#e8eaf0;font-size:17px;outline:none;">
            ${["💪","🔥","😅","😎","🤩","😤","🥵","💯","🏆","😴"].map(e=>`<option value="${e}"${s.form.emoji===e?" selected":""}>${e}</option>`).join("")}
          </select>
        </div>
        ${tf.length?`
        <div style="background:#0d1528;border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1px solid #1e2d4a;">
          <div style="font-size:10px;color:${COLORS[s.user]};font-weight:700;letter-spacing:1px;margin-bottom:8px;">📊 TRACKING</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            ${tf.includes("distanz")?`<div><div style="font-size:10px;color:#4a7ab5;margin-bottom:3px;">${s.form.sport==="Schwimmen"?"Distanz (m)":"Distanz (km)"}</div><input type="text" inputmode="decimal" placeholder="${s.form.sport==="Schwimmen"?"z.B. 750":"z.B. 5.4"}" value="${s.form.distanz}" onblur="setFF('distanz',this.value)" onchange="setFF('distanz',this.value)" style="width:100%;background:#111c35;border:1px solid #1e2d4a;border-radius:8px;padding:7px 10px;color:#e8eaf0;font-size:13px;outline:none;"></div>`:""}
            ${tf.includes("puls_avg")?`<div><div style="font-size:10px;color:#4a7ab5;margin-bottom:3px;">Ø Puls (bpm)</div><input type="text" inputmode="numeric" placeholder="z.B. 145" value="${s.form.puls_avg}" onblur="setFF('puls_avg',this.value)" onchange="setFF('puls_avg',this.value)" style="width:100%;background:#111c35;border:1px solid #1e2d4a;border-radius:8px;padding:7px 10px;color:#e8eaf0;font-size:13px;outline:none;"></div>`:""}
            ${tf.includes("puls_max")?`<div><div style="font-size:10px;color:#4a7ab5;margin-bottom:3px;">Max Puls (bpm)</div><input type="text" inputmode="numeric" placeholder="z.B. 175" value="${s.form.puls_max}" onblur="setFF('puls_max',this.value)" onchange="setFF('puls_max',this.value)" style="width:100%;background:#111c35;border:1px solid #1e2d4a;border-radius:8px;padding:7px 10px;color:#e8eaf0;font-size:13px;outline:none;"></div>`:""}

      </div>
      <div style="display:flex;gap:7px;margin-bottom:9px;">
        <input id="chatInput" value="${s.chatInput.replace(/"/g,"&quot;")}" oninput="ss({chatInput:this.value})" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}" placeholder="Schreib ${other} was..."
          style="flex:1;background:#111c35;border:1px solid #1e2d4a;border-radius:12px;padding:10px 13px;color:#e8eaf0;font-size:13px;outline:none;" />
        <button onclick="sendMsg()" ${s.sending||!s.chatInput.trim()?"disabled":""} style="background:${COLORS[s.user]};color:#0a0e1a;border:none;border-radius:12px;padding:10px 17px;font-weight:800;font-size:15px;cursor:pointer;opacity:${s.sending||!s.chatInput.trim()?0.45:1};">➤</button>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;">
        ${["💪 War heute im Training!","😅 Heute wird nix mehr...","🔥 Wann trainierst du?","🏊 Pool morgen?","🚴 Fahrt am Wochenende?","😎 Keine Ausreden!","🏃 5km heute?","🎾 Padel später?"].map(q=>`
          <button onclick="ss({chatInput:'${q}'})" style="background:#111c35;border:1px solid #1e2d4a;color:#6b8ab0;border-radius:18px;padding:4px 10px;font-size:10px;cursor:pointer;font-weight:600;">${q}</button>`).join("")}
      </div>
    `:""}

    </div>

    <!-- BOTTOM NAV -->
    <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0d1528;border-top:1px solid #1e2d4a;display:flex;">
      ${[{id:"feed",icon:"📡",label:"Feed"},{id:"plan",icon:"📋",label:"Plan"},{id:"stats",icon:"⚡",label:"Duell"},{id:"chat",icon:"💬",label:"Chat"}].map(t=>`
        <button onclick="ss({tab:'${t.id}'})" style="flex:1;padding:11px 0 9px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid ${s.tab===t.id?COLORS[s.user]:"transparent"};">
          <span style="font-size:19px;">${t.icon}</span>
          <span style="font-size:10px;font-weight:700;color:${s.tab===t.id?COLORS[s.user]:"#4a7ab5"};">${t.label}</span>
        </button>`).join("")}
    </div>
  </div>`;
}

window.ss          = ss;
window.setUser     = u => ss({user:u});
window.toggleLog   = () => ss({showLog:!S.showLog});
window.setFormSport= sp => ss({form:{...S.form,sport:sp}});
window.setFF       = (k,v) => ss({form:{...S.form,[k]:v}});
window.saveEntry   = saveEntry;
window.delEntry    = delEntry;
window.sendMsg     = sendMsg;
window.fetchAiMoti = fetchAiMoti;

render();
</script>
</body>
</html>
