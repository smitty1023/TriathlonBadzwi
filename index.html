<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="icon" href="icon-512.png" />
  <title>Tri-Duell</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    body{background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif;color:#e8eaf0}

<body>
<div id="root"><div style="color:#4a7ab5;text-align:center;padding:40px">Laden...</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore,collection,addDoc,deleteDoc,updateDoc,doc,query,orderBy,onSnapshot,serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey:"AIzaSyCK3_0SUOrmRVsNCCXGJmXYwSKNvaBJO-8",
  authDomain:"triathlon-455c8.firebaseapp.com",
  projectId:"triathlon-455c8",
  storageBucket:"triathlon-455c8.firebasestorage.app",
  messagingSenderId:"1087991994879",
  appId:"1:1087991994879:web:8c79b6fdebcb6ea2262fca"
}));

const RACE   = new Date("2026-08-30");
const NAMES  = ["Smitty","J-Smooth"];
const COL    = {Smitty:"#00e5ff","J-Smooth":"#ff6b35"};
const ICO    = {Smitty:"🔵","J-Smooth":"🟠"};
const SICO   = {Schwimmen:"🏊",Radfahren:"🚴",Laufen:"🏃",Brick:"🔥",Krafttraining:"🏋️",Basketball:"🏀",Padel:"🎾",Yoga:"🧘",Wandern:"🥾",Anderes:"⚡"};
const SCAT   = {Schwimmen:"tri",Radfahren:"tri",Laufen:"tri",Brick:"tri",Krafttraining:"extra",Basketball:"extra",Padel:"extra",Yoga:"extra",Wandern:"extra",Anderes:"extra"};
const TF     = {Laufen:["distanz","puls_avg","puls_max","pace"],Radfahren:["distanz","puls_avg","puls_max","speed"],Schwimmen:["distanz","schwimmbahnen"],Brick:["distanz","puls_avg"],Wandern:["distanz"]};
const MOTI   = [{e:"🔥",t:"Diese Woche war ruhig – der 30. August wartet nicht!"},{e:"💪",t:"Jan Frodeno hatte auch schwache Wochen. Dann hat er trotzdem trainiert."},{e:"🏁",t:"Jede Einheit zählt – macht euch warm!"},{e:"🤜🤛",t:"Einer muss anfangen – und dann zieht der andere nach!"}];

const PLAN_START = new Date("2026-05-25");
const PHASES = [{n:"Basis",w:[1,2,3,4],c:"#4ade80"},{n:"Aufbau",w:[5,6,7,8],c:"#facc15"},{n:"Intensität",w:[9,10,11,12],c:"#fb923c"},{n:"Peak & Taper",w:[13,14,15,16],c:"#f87171"}];
const SES = [
  [{d:"Di",s:"Schwimmen",desc:"Technik-Schwimmen",dur:30,det:"4×100m, Fokus Gleiten"},{d:"Do",s:"Laufen",desc:"Lockerer Dauerlauf",dur:35,det:"Puls 130-140"},{d:"Sa",s:"Radfahren",desc:"Grundlagenfahrt",dur:60,det:"Zone 2, ≥85 rpm"},{d:"So",s:"Laufen",desc:"Langer Lauf",dur:45,det:"Puls <140"}],
  [{d:"Di",s:"Schwimmen",desc:"Ausdauer-Schwimmen",dur:35,det:"600m + 4×50m"},{d:"Do",s:"Radfahren",desc:"Intervallfahrt",dur:45,det:"5×3 min Zone 3"},{d:"Sa",s:"Laufen",desc:"Tempodauerlauf",dur:40,det:"Puls 145-155"},{d:"So",s:"Schwimmen",desc:"Regeneration",dur:30,det:"Ruhig"}],
  [{d:"Di",s:"Laufen",desc:"Fahrtspiel",dur:40,det:"5×2 min flott"},{d:"Do",s:"Schwimmen",desc:"750m non-stop",dur:35,det:"Rennpace"},{d:"Sa",s:"Radfahren",desc:"Lange Fahrt",dur:75,det:"Zone 2"},{d:"So",s:"Laufen",desc:"Easy Run",dur:30,det:"Sehr locker"}],
  [{d:"Di",s:"Schwimmen",desc:"Deload Technik",dur:25,det:"Kein Druck"},{d:"Do",s:"Laufen",desc:"Deload locker",dur:30,det:"Puls <130"},{d:"Sa",s:"Radfahren",desc:"Deload Fahrt",dur:45,det:"Zone 1-2"}],
  [{d:"Di",s:"Schwimmen",desc:"Intervall-Schwimmen",dur:40,det:"8×100m Rennpace"},{d:"Do",s:"Radfahren",desc:"Schwelle",dur:50,det:"3×8 min"},{d:"Sa",s:"Brick",desc:"Brick-Training",dur:60,det:"45 min Rad + 15 min Lauf"},{d:"So",s:"Laufen",desc:"Langer Lauf",dur:50,det:"Zone 2"}],
  [{d:"Di",s:"Schwimmen",desc:"Rennsimulation",dur:35,det:"750m + 4×50m"},{d:"Do",s:"Laufen",desc:"Tempointervalle",dur:45,det:"3×1km"},{d:"Sa",s:"Radfahren",desc:"Hügel",dur:60,det:"Kraft & Technik"},{d:"So",s:"Schwimmen",desc:"Aerob",dur:35,det:"1200m locker"}],
  [{d:"Di",s:"Brick",desc:"Kurz-Brick",dur:55,det:"30+20 min"},{d:"Do",s:"Schwimmen",desc:"Sprint-Intervalle",dur:35,det:"10×50m"},{d:"Sa",s:"Radfahren",desc:"Lange Fahrt",dur:90,det:"27km+"},{d:"So",s:"Laufen",desc:"Mittellanger Lauf",dur:50,det:"Puls 145"}],
  [{d:"Di",s:"Schwimmen",desc:"Deload",dur:25,det:"Locker"},{d:"Do",s:"Laufen",desc:"Deload",dur:30,det:"Locker"},{d:"Sa",s:"Radfahren",desc:"Deload",dur:45,det:"Zone 1"}],
  [{d:"Di",s:"Schwimmen",desc:"Race-Pace",dur:40,det:"2×750m"},{d:"Do",s:"Radfahren",desc:"VO2max",dur:55,det:"6×4 min"},{d:"Sa",s:"Brick",desc:"Rennsimulation",dur:70,det:"27km+5,4km!"},{d:"So",s:"Laufen",desc:"Easy Recovery",dur:30,det:"Puls <130"}],
  [{d:"Di",s:"Schwimmen",desc:"Strecke+Speed",dur:40,det:"500m+10×50m"},{d:"Do",s:"Laufen",desc:"5km-Test",dur:35,det:"Zeitnahme!"},{d:"Sa",s:"Radfahren",desc:"Rennstrecke",dur:75,det:"27km Zeitnahme"},{d:"So",s:"Schwimmen",desc:"Regeneration",dur:30,det:"Locker"}],
  [{d:"Di",s:"Brick",desc:"Wettkampf-Brick",dur:75,det:"Volle Distanz"},{d:"Do",s:"Schwimmen",desc:"Technik",dur:35,det:"Fokus Wende"},{d:"Sa",s:"Radfahren",desc:"Intervalle",dur:60,det:"5×5 min"},{d:"So",s:"Laufen",desc:"Tempodauerlauf",dur:40,det:"Puls 150-160"}],
  [{d:"Di",s:"Schwimmen",desc:"Deload",dur:25,det:"Locker"},{d:"Do",s:"Laufen",desc:"Deload",dur:25,det:"Locker"},{d:"Sa",s:"Radfahren",desc:"Deload",dur:40,det:"Locker"}],
  [{d:"Di",s:"Schwimmen",desc:"Kurze Schwelle",dur:30,det:"4×100m"},{d:"Do",s:"Radfahren",desc:"Kurze Intervalle",dur:40,det:"3×5 min"},{d:"Sa",s:"Brick",desc:"Kurz-Brick",dur:50,det:"20+15 min"},{d:"So",s:"Laufen",desc:"Locker",dur:25,det:"Entspannt"}],
  [{d:"Di",s:"Schwimmen",desc:"Renngefühl",dur:25,det:"750m"},{d:"Do",s:"Laufen",desc:"Lockerheit",dur:25,det:"Steigerungen"},{d:"Sa",s:"Radfahren",desc:"Activation",dur:35,det:"3×2 min"}],
  [{d:"Di",s:"Schwimmen",desc:"Super kurz",dur:20,det:"400m"},{d:"Do",s:"Laufen",desc:"Joggen",dur:15,det:"15 min locker"}],
  [{d:"Mo",s:"Schwimmen",desc:"Mini-Aktivierung",dur:15,det:"300m"},{d:"Di",s:"Laufen",desc:"Mini-Aktivierung",dur:10,det:"10 min"},{d:"So",s:"Radfahren",desc:"RENNTAG!",dur:0,det:"Alles geben!"}],
];
const PLAN = SES.map((sessions,i)=>{
  const d=new Date(PLAN_START); d.setDate(d.getDate()+i*7);
  const p=PHASES.find(x=>x.w.includes(i+1));
  return {num:i+1,phase:p.n,col:p.c,start:d,sessions,deload:[4,8,12].includes(i+1)};
});
function curWeek(){ return Math.max(0,Math.min(Math.floor((new Date()-PLAN_START)/604800000),15)); }
function daysLeft(){ return Math.ceil((RACE-new Date())/86400000); }
function fmtDate(d){ return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}); }
function fmtTs(ts){
  if(!ts||!ts.toDate) return "";
  const d=ts.toDate();
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
}

// ── State ─────────────────────────────────────────────────────────────────────
let ST = {
  tab:"feed", user:"Smitty", entries:[], messages:[],
  showLog:false, selWeek:curWeek(),
  form:{sport:"Laufen",duration:"",note:"",emoji:"💪",distanz:"",puls_avg:"",puls_max:"",pace:"",speed:"",schwimmbahnen:""},
  saving:false, sending:false, toast:null, moti:null, motiLoading:false,
  chatInput:"", activeComment:null,
};
function ef(sport){ return {sport,duration:"",note:"",emoji:"💪",distanz:"",puls_avg:"",puls_max:"",pace:"",speed:"",schwimmbahnen:""}; }
function up(patch){
  const active=document.activeElement;
  const typing = active&&(active.tagName==="INPUT"||active.tagName==="TEXTAREA")&&(ST.showLog||ST.activeComment);
  ST={...ST,...patch};
  if(!typing||patch.tab!==undefined||patch.showLog!==undefined||patch.activeComment!==undefined||patch.entries!==undefined||patch.messages!==undefined){
    draw();
  }
}

// ── Firebase ──────────────────────────────────────────────────────────────────
onSnapshot(query(collection(db,"entries"),orderBy("ts","desc")),snap=>{
  ST.entries=snap.docs.map(d=>({id:d.id,...d.data()}));
  checkMoti();
  draw();
});
onSnapshot(query(collection(db,"messages"),orderBy("ts","asc")),snap=>{
  ST.messages=snap.docs.map(d=>({id:d.id,...d.data()}));
  draw();
  setTimeout(()=>document.getElementById("cb")?.scrollIntoView({behavior:"smooth"}),60);
});

function checkMoti(){
  const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const n=ST.entries.filter(e=>e.ts?.toDate?.()>=mon&&["Schwimmen","Radfahren","Laufen","Brick"].includes(e.sport)).length;
  if(new Date().getDay()>=3&&n<2&&!ST.moti) ST.moti=MOTI[Math.floor(Math.random()*MOTI.length)];
}

async function save(){
  if(!ST.form.duration) return;
  up({saving:true});
  try{
    const f=ST.form;
    await addDoc(collection(db,"entries"),{
      athlete:ST.user,sport:f.sport,duration:f.duration,note:f.note,emoji:f.emoji,ts:serverTimestamp(),
      tracking:{distanz:f.distanz||null,puls_avg:f.puls_avg||null,puls_max:f.puls_max||null,pace:f.pace||null,speed:f.speed||null,schwimmbahnen:f.schwimmbahnen||null},
      reactions:{},comments:[],
    });
    toast(ICO[ST.user]+" Einheit gespeichert!");
    up({form:ef("Laufen"),showLog:false,tab:"feed",saving:false});
  }catch(e){ toast("Fehler"); up({saving:false}); }
}

async function del(id){
  if(!confirm("Einheit löschen?")) return;
  try{ await deleteDoc(doc(db,"entries",id)); }catch(e){}
}

async function react(id,emoji){
  try{
    const e=ST.entries.find(x=>x.id===id);
    const r={...(e?.reactions||{})};
    if(r[ST.user]===emoji) delete r[ST.user]; else r[ST.user]=emoji;
    await updateDoc(doc(db,"entries",id),{reactions:r});
  }catch(e){}
}

async function comment(id){
  const inp=document.getElementById("ci"+id);
  const text=(inp?.value||"").trim();
  if(!text) return;
  try{
    const e=ST.entries.find(x=>x.id===id);
    const comments=[...(e?.comments||[]),{author:ST.user,text,ts:new Date().toISOString()}];
    await updateDoc(doc(db,"entries",id),{comments});
    up({activeComment:null});
  }catch(e){}
}

async function sendMsg(){
  const inp=document.getElementById("chatInp");
  const text=(inp?.value||ST.chatInput).trim();
  if(!text) return;
  up({sending:true});
  try{ await addDoc(collection(db,"messages"),{author:ST.user,text,ts:serverTimestamp()}); up({chatInput:"",sending:false}); }
  catch(e){ up({sending:false}); }
}

async function aiMoti(){
  up({motiLoading:true});
  try{
    const mon=new Date(); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); mon.setHours(0,0,0,0);
    const wk=ST.entries.filter(e=>e.ts?.toDate?.()>=mon);
    const tc=wk.filter(e=>["Schwimmen","Radfahren","Laufen","Brick"].includes(e.sport)).length;
    const ec=wk.filter(e=>!["Schwimmen","Radfahren","Laufen","Brick"].includes(e.sport)).length;
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,messages:[{role:"user",content:"Triathlon-Coach für Smitty und J-Smooth, Sprint-Triathlon am 30.8.2026, noch "+daysLeft()+" Tage. Woche: "+tc+" Tri, "+ec+" andere Einheiten. 2-3 Sätze motivierend humorvoll auf Deutsch, direkt starten."}]})});
    const data=await res.json();
    const txt=data.content?.map(c=>c.text||"").join("")||"";
    if(txt) up({moti:{e:"🤖",t:txt.trim(),ai:true},motiLoading:false});
  }catch(e){ up({moti:MOTI[0],motiLoading:false}); }
}

function toast(msg){ up({toast:msg}); setTimeout(()=>up({toast:null}),2500); }

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  const s=ST, w=PLAN[s.selWeek], cw=curWeek(), other=s.user==="Smitty"?"J-Smooth":"Smitty";
  const tf=TF[s.form.sport]||[];

  // ─ entry cards ─
  function entryCard(e){
    const ex=SCAT[e.sport]==="extra", bc=ex?"#a855f7":COL[e.athlete]||"#00e5ff";
    const t=e.tracking||{}, r=e.reactions||{}, cmts=e.comments||[];
    const myR=r[s.user]||"";
    const emojis=["🔥","💪","😅","👏","🤣","😮"];
    return `
    <div style="background:#111c35;border-radius:14px;padding:12px 14px;margin-bottom:9px;border:1px solid ${bc}25;border-left:3px solid ${bc}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">
            <span style="font-size:17px">${e.emoji||"💪"}</span>
            <span style="font-weight:800;font-size:14px">${SICO[e.sport]||"⚡"} ${e.sport}</span>
            <span style="font-size:10px;background:${(COL[e.athlete]||"#00e5ff")}25;color:${COL[e.athlete]||"#00e5ff"};padding:2px 7px;border-radius:9px;font-weight:700">${e.athlete}</span>
            ${ex?'<span style="font-size:10px;background:#a855f720;color:#a855f7;padding:2px 7px;border-radius:8px;font-weight:700">EXTRA</span>':""}
          </div>
          ${(t.distanz||t.puls_avg||t.pace||t.speed||t.schwimmbahnen)?`
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px">
            ${t.distanz?`<span style="font-size:11px;background:#0d1528;color:#4ade80;padding:2px 8px;border-radius:8px;font-weight:700">📍 ${t.distanz}${e.sport==="Schwimmen"?"m":"km"}</span>`:""}
            ${t.puls_avg?`<span style="font-size:11px;background:#0d1528;color:#f87171;padding:2px 8px;border-radius:8px;font-weight:700">❤️ Ø${t.puls_avg}bpm</span>`:""}
            ${t.puls_max?`<span style="font-size:11px;background:#0d1528;color:#fb923c;padding:2px 8px;border-radius:8px;font-weight:700">⬆️ ${t.puls_max}bpm</span>`:""}
            ${t.pace?`<span style="font-size:11px;background:#0d1528;color:#facc15;padding:2px 8px;border-radius:8px;font-weight:700">⏱ ${t.pace}/km</span>`:""}
            ${t.speed?`<span style="font-size:11px;background:#0d1528;color:#facc15;padding:2px 8px;border-radius:8px;font-weight:700">💨 ${t.speed}km/h</span>`:""}
            ${t.schwimmbahnen?`<span style="font-size:11px;background:#0d1528;color:#00e5ff;padding:2px 8px;border-radius:8px;font-weight:700">🏊 ${t.schwimmbahnen} Bahnen</span>`:""}
          </div>`:""}
          ${e.note?`<div style="font-size:12px;color:#8ba0c0;margin-bottom:3px">"${e.note}"</div>`:""}
          <div style="font-size:11px;color:#4a7ab5">⏱ ${e.duration} min · ${fmtTs(e.ts)}</div>
          <div style="display:flex;align-items:center;gap:4px;margin-top:7px;flex-wrap:wrap">
            ${emojis.map(em=>{
              const cnt=Object.values(r).filter(x=>x===em).length;
              const mine=myR===em;
              return `<button onclick="W.react('${e.id}','${em}')" style="background:${mine?"#1e3a2a":"#0d1528"};border:1px solid ${mine?"#4ade8060":"#1e2d4a"};border-radius:18px;padding:3px 8px;cursor:pointer;font-size:12px">${em}${cnt>0?`<span style="font-size:10px;color:#6b8ab5;margin-left:2px">${cnt}</span>`:""}</button>`;
            }).join("")}
            <button onclick="W.toggleCmt('${e.id}')" style="background:${s.activeComment===e.id?"#1a2d4a":"#0d1528"};border:1px solid ${s.activeComment===e.id?"#4a7ab5":"#1e2d4a"};border-radius:18px;padding:3px 10px;cursor:pointer;font-size:12px;color:#6b8ab0;font-weight:700">💬${cmts.length>0?` ${cmts.length}`:""}</button>
          </div>
          ${cmts.length>0?`
          <div style="margin-top:7px;display:flex;flex-direction:column;gap:5px">
            ${cmts.map(c=>`
            <div style="background:#0d1528;border-radius:9px;padding:6px 10px;border-left:2px solid ${COL[c.author]||"#4a7ab5"}">
              <div style="font-size:10px;color:${COL[c.author]||"#4a7ab5"};font-weight:700;margin-bottom:2px">${ICO[c.author]||"🔵"} ${c.author}</div>
              <div style="font-size:12px;color:#c4d0e0;line-height:1.4">${c.text}</div>
            </div>`).join("")}
          </div>`:""}
          ${s.activeComment===e.id?`
          <div style="display:flex;gap:6px;margin-top:7px">
            <input id="ci${e.id}" placeholder="Kommentar..." style="flex:1;background:#0d1528;border:1px solid #4a7ab560;border-radius:10px;padding:7px 11px;color:#e8eaf0;font-size:13px;outline:none" />
            <button onclick="W.comment('${e.id}')" style="background:${COL[s.user]};color:#0a0e1a;border:none;border-radius:10px;padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer">➤</button>
          </div>`:""}
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-left:8px;flex-shrink:0">
          <div style="font-size:22px;opacity:0.4">${SICO[e.sport]||"⚡"}</div>
          <button onclick="W.del('${e.id}')" style="background:#1a2540;border:none;color:#f87171;border-radius:8px;padding:4px 8px;font-size:13px;cursor:pointer">🗑️</button>
        </div>
      </div>
    </div>`;
  }

  // ─ log form ─
  function logForm(){
    return `
    <div style="background:#111c35;border-radius:16px;padding:15px;border:1px solid #1e2d4a;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:13px;font-weight:700;color:${COL[s.user]}">${ICO[s.user]} ${s.user}s Einheit</div>
        <button onclick="up({showLog:false})" style="background:#1a2540;border:none;color:#6b8ab0;border-radius:50%;width:28px;height:28px;font-size:15px;cursor:pointer">✕</button>
      </div>
      <div style="font-size:10px;color:#4a7ab5;font-weight:700;letter-spacing:1px;margin-bottom:6px">TRIATHLON</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
        ${["Schwimmen","Radfahren","Laufen","Brick"].map(sp=>`<button onclick="W.sport('${sp}')" style="padding:5px 11px;border-radius:16px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:${s.form.sport===sp?COL[s.user]:"#1a2540"};color:${s.form.sport===sp?"#0a0e1a":"#6b8ab0"}">${SICO[sp]} ${sp}</button>`).join("")}
      </div>
      <div style="font-size:10px;color:#4a7ab5;font-weight:700;letter-spacing:1px;margin-bottom:6px">EXTRAS</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">
        ${["Krafttraining","Basketball","Padel","Yoga","Wandern","Anderes"].map(sp=>`<button onclick="W.sport('${sp}')" style="padding:5px 11px;border-radius:16px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:${s.form.sport===sp?"#a855f7":"#1a2540"};color:${s.form.sport===sp?"#fff":"#6b8ab0"}">${SICO[sp]} ${sp}</button>`).join("")}
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="fdur" type="text" inputmode="numeric" placeholder="Dauer (min)" style="flex:1;background:#0d1528;border:1px solid #1e2d4a;border-radius:10px;padding:9px 12px;color:#e8eaf0;font-size:13px;outline:none" />

    </div>

    <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0d1528;border-top:1px solid #1e2d4a;display:flex">
      ${[{id:"feed",icon:"📡",label:"Feed"},{id:"plan",icon:"📋",label:"Plan"},{id:"stats",icon:"⚡",label:"Duell"},{id:"chat",icon:"💬",label:"Chat"}].map(t=>`
      <button onclick="up({tab:'${t.id}'})" style="flex:1;padding:11px 0 9px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid ${s.tab===t.id?COL[s.user]:"transparent"}">
        <span style="font-size:19px">${t.icon}</span>
        <span style="font-size:10px;font-weight:700;color:${s.tab===t.id?COL[s.user]:"#4a7ab5"}">${t.label}</span>
      </button>`).join("")}
    </div>
  </div>`;

  document.getElementById("root").innerHTML=html;
}

// ── Window API ────────────────────────────────────────────────────────────────
window.up = up;
window.W = {
  user: a => up({user:a}),
  toggleLog: () => up({showLog:!ST.showLog}),
  sport: sp => up({form:{...ST.form,sport:sp}}),
  ff: (k,v) => up({form:{...ST.form,[k]:v}}),
  saveNow: () => {
    const get = id => document.getElementById(id)?.value||"";
    ST.form.duration    = get("fdur");
    ST.form.note        = get("fnote");
    ST.form.distanz     = get("fdistanz");
    ST.form.puls_avg    = get("fpuls_avg");
    ST.form.puls_max    = get("fpuls_max");
    ST.form.pace        = get("fpace");
    ST.form.speed       = get("fspeed");
    ST.form.schwimmbahnen = get("fschwimmbahnen");
    save();
  },
  del, react, comment,
  toggleCmt: id => up({activeComment: ST.activeComment===id ? null : id}),
  sendMsg,
  aiMoti,
};

draw();
</script>
